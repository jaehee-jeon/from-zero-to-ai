name: job-ladder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assign-presenters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      assignments: ${{ steps.assign.outputs.assignments }}
      round: ${{ steps.assign.outputs.round }}
      context: ${{ steps.assign.outputs.context }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config/members.json
            config/topics.json
          sparse-checkout-cone-mode: false

      - name: skip 확인
        id: skip_check
        run: |
          SKIP=$(cat config/topics.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('skip', False))")
          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          if [ "$SKIP" == "True" ]; then
            echo "skip: true → 조용히 종료"
          fi

      - name: confirmed 확인
        if: steps.skip_check.outputs.skip != 'True'
        run: |
          CONFIRMED=$(cat config/topics.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('confirmed', False))")
          if [ "$CONFIRMED" != "True" ]; then
            echo "ERROR: confirmed가 true가 아닙니다"
            exit 1
          fi

      - name: validation 확인
        if: steps.skip_check.outputs.skip != 'True'
        run: |
          python3 << 'PYEOF'
          import json, sys

          VALID_WEEK_LABELS = ["1주차", "2주차", "3주차", "4주차"]

          with open('config/topics.json', 'r', encoding='utf-8') as f:
            data = json.load(f)

          with open('config/members.json', 'r', encoding='utf-8') as f:
            members = json.load(f)

          member_ids = [m['githubUsername'] for m in members]
          errors = []
          assignees = []

          for i, t in enumerate(data['topics']):
            # title 빈값 체크
            if not t.get('title', '').strip():
              errors.append(f"topics[{i}] title이 비어있습니다")

            # weekLabel 유효값 체크
            if t.get('weekLabel') not in VALID_WEEK_LABELS:
              errors.append(f"topics[{i}] weekLabel이 올바르지 않습니다: {t.get('weekLabel')} (허용값: {VALID_WEEK_LABELS})")

            # assignee 중복 체크
            if t.get('assignee'):
              if t['assignee'] in assignees:
                errors.append(f"topics[{i}] assignee 중복: {t['assignee']}")
              assignees.append(t['assignee'])

              # assignee가 members.json에 있는지 체크
              if t['assignee'] not in member_ids:
                errors.append(f"topics[{i}] assignee {t['assignee']}가 members.json에 없습니다")

          if errors:
            for e in errors:
              print(f"ERROR: {e}")
            sys.exit(1)

          print("validation 완료")
          PYEOF

      - name: 발표자 랜덤 배정
        if: steps.skip_check.outputs.skip != 'True'
        id: assign
        run: |
          python3 << 'PYEOF'
          import json, random, os

          with open('config/members.json', 'r', encoding='utf-8') as f:
            members = json.load(f)

          with open('config/topics.json', 'r', encoding='utf-8') as f:
            topics_data = json.load(f)

          topics = topics_data['topics']
          round_num = topics_data['round']
          context = topics_data.get('context', '')
          all_ids = [m['githubUsername'] for m in members]

          assignments = []
          assigned_members = []

          for topic in topics:
            title = topic['title']
            week_label = topic.get('weekLabel', '')
            submitted_by = topic.get('submittedBy', '')
            difficult_submitters = topic.get('difficultSubmitters', [])

            if topic.get('assignee'):
              assignments.append({
                'title': title,
                'weekLabel': week_label,
                'assignee': topic['assignee'],
                'submittedBy': submitted_by,
                'reason': topic.get('reason', ''),
                'fallback': False
              })
              assigned_members.append(topic['assignee'])
              continue

            # 1차: 어려운 사람 제외 + 이미 배정된 사람 제외
            candidates = [
              m for m in all_ids
              if m != submitted_by
              and m not in difficult_submitters
              and m not in assigned_members
            ]
            fallback = False

            # 2차: 이미 배정된 사람만 제외
            if not candidates:
              candidates = [m for m in all_ids if m not in assigned_members]
              fallback = True

            # 3차: 전체 랜덤
            if not candidates:
              candidates = all_ids
              fallback = True

            assignee = random.choice(candidates)
            assigned_members.append(assignee)

            assignments.append({
              'title': title,
              'weekLabel': week_label,
              'assignee': assignee,
              'submittedBy': submitted_by,
              'reason': topic.get('reason', ''),
              'fallback': fallback
            })

          result = json.dumps(assignments, ensure_ascii=False)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"assignments={result}\n")
            f.write(f"round={round_num}\n")
            f.write(f"context={context}\n")

          print(f"Round {round_num} 발표자 배정 완료:")
          for a in assignments:
            flag = " ⚠️ fallback" if a['fallback'] else ""
            print(f"  [{a['weekLabel']}] {a['title']} → {a['assignee']}{flag}")
          PYEOF

      - name: Teams 배정 결과 전송
        if: steps.skip_check.outputs.skip != 'True'
        env:
          TEAMS_WEBHOOK_WEEKLY: ${{ secrets.TEAMS_WEBHOOK_WEEKLY }}
          ASSIGNMENTS: ${{ steps.assign.outputs.assignments }}
          ROUND: ${{ steps.assign.outputs.round }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          assignments = json.loads(os.environ['ASSIGNMENTS'])
          round_num = os.environ['ROUND']
          webhook_url = os.environ['TEAMS_WEBHOOK_WEEKLY']

          body_items = []
          for a in assignments:
            note = " (전원 어려워해서 랜덤 배정)" if a.get('fallback') else ""
            body_items.append({
              "type": "TextBlock",
              "text": f"🎯 [{a['weekLabel']}] {a['title']} → @{a['assignee']}{note}",
              "wrap": True
            })

          payload = {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.2",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": f"🎲 Round {round_num} 발표자 배정 완료!",
                    "weight": "Bolder",
                    "size": "Medium"
                  },
                  *body_items,
                  {
                    "type": "TextBlock",
                    "text": "📝 #study-board에서 본인 티켓을 확인하세요!",
                    "color": "Attention"
                  }
                ]
              }
            }]
          }

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(
            webhook_url, data=data,
            headers={'Content-Type': 'application/json'}, method='POST'
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as resp:
              print(f"전송 완료 (HTTP {resp.status})")
          except Exception as e:
            print(f"ERROR: {e}")
            raise
          PYEOF

  trigger-guide:
    needs: assign-presenters
    if: needs.assign-presenters.outputs.assignments != ''
    uses: ./.github/workflows/job-guide.yml
    with:
      assignments: ${{ needs.assign-presenters.outputs.assignments }}
      round: ${{ needs.assign-presenters.outputs.round }}
      context: ${{ needs.assign-presenters.outputs.context }}
    secrets: inherit