name: job-guide

on:
  workflow_call:
    inputs:
      assignments:
        required: true
        type: string
      week:
        required: true
        type: string
      presenting_team:
        required: true
        type: string
      context:
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:          # ANTHROPIC_API_KEY 대신 GEMINI_API_KEY 수신
        required: true
      TEAMS_WEBHOOK_BOARD:
        required: true
      TEAMS_WEBHOOK_WEEKLY:
        required: true

permissions:
  contents: write  # 문제지 repo push용

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 질문 생성 + 티켓 전송 + 문제지 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_WEBHOOK_BOARD: ${{ secrets.TEAMS_WEBHOOK_BOARD }}
          TEAMS_WEBHOOK_WEEKLY: ${{ secrets.TEAMS_WEBHOOK_WEEKLY }}
          ASSIGNMENTS: ${{ inputs.assignments }}
          WEEK: ${{ inputs.week }}
          PRESENTING_TEAM: ${{ inputs.presenting_team }}
          CONTEXT: ${{ inputs.context }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error, time

          assignments = json.loads(os.environ['ASSIGNMENTS'])
          week = os.environ['WEEK']
          presenting_team = os.environ['PRESENTING_TEAM']
          context = os.environ['CONTEXT']
          api_key = os.environ['GEMINI_API_KEY']
          webhook_board = os.environ['TEAMS_WEBHOOK_BOARD']
          webhook_weekly = os.environ['TEAMS_WEBHOOK_WEEKLY']

          with open('config/members.json', 'r', encoding='utf-8') as f:
            members = json.load(f)

          id_map = {m['githubUsername']: {'teamsId': m['teamsId'], 'name': m['name'], 'team': m['team']} for m in members}

          def call_gemini(prompt, response_schema=None):
            """Gemini 1.5 Flash API 호출 (Structured Outputs 적용)"""
            # 비용 절감 및 속도를 위해 gemini-1.5-flash 모델 적용
            url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
            
            contents = {
              "contents": [{
                "parts": [{"text": prompt}]
              }]
            }
            
            # JSON 스키마 강제 옵션이 있을 경우 인프라단에서 JSON 구조 제어
            if response_schema:
              contents["generationConfig"] = {
                "responseMimeType": "application/json",
                "responseSchema": response_schema
              }

            data = json.dumps(contents).encode('utf-8')
            req = urllib.request.Request(
              url, data=data,
              headers={"Content-Type": "application/json"},
              method='POST'
            )
            try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                result = json.loads(resp.read().decode('utf-8'))
                return result['candidates'][0]['content']['parts'][0]['text'].strip()
            except Exception as e:
              print(f"WARNING: Gemini API 실패 ({e})")
              return None

          def generate_ticket_questions(title, reason):
            """발표자용 Q1, Q2 생성 (Gemini Structured Outputs 구조 보장)"""
            prompt = f"""
당신은 학습 설계 전문가입니다. 비전공자와 전공자가 반반인 학생 스터디를 리드하고 있습니다.
발표자가 발표를 잘 준비할 수 있도록 가이드가 되는 날카로운 질문 2개를 한국어로 만들어주세요.

요청 항목:
q1 (오개념 교정): 이 개념에서 가장 많이 잘못 이해하는 부분을 찾아서 "혹시 ~라고 생각하시나요? 그렇다면 왜 틀렸는지 설명해주세요" 형식으로 구성하세요.
q2 (재설명): "이 개념을 모르는 팀원한테 카톡 3줄로 설명한다면?" 형식으로 질문을 구성하세요.

주의:
- 반드시 한국어 사용
- AI 복붙 불가 및 비전공자 맞춤형 깊이 유지
- title이 빈값이면 빈 문자열 객체를 생성하세요.

스터디 맥락: {context}
주제: {title}
막힌 부분: {reason}
"""
            # Gemini가 무조건 해당 구조의 JSON만 주도록 스키마 정의
            schema = {
              "type": "OBJECT",
              "properties": {
                "q1": {"type": "STRING"},
                "q2": {"type": "STRING"}
              },
              "required": ["q1", "q2"]
            }
            
            result = call_gemini(prompt, schema)
            if result:
              try:
                return json.loads(result)
              except:
                pass
            return {
              "q1": f"혹시 {title}이 단순히 암기하면 되는 개념이라고 생각하시나요? 그렇다면 왜 틀렸는지 설명해주세요.",
              "q2": f"{title}을 모르는 팀원한테 카톡 3줄로 설명한다면?"
            }

          def generate_quiz(title, reason, assignee_name):
            """전원용 실습 문제 생성 (Gemini Structured Outputs 구조 보장)"""
            prompt = f"""
당신은 학습 설계 전문가입니다. 비전공자도 공부했으면 충분히 이해하고 풀 수 있는 실습 문제 1개를 한국어로 제작해주세요.

조건:
- 기초 개념이 확실히 잡히는 문제
- 코드 구현 혹은 손으로 직접 추적해서 풀어야 하는 명확한 정답이 있는 문제
- 질문(questions)은 명확하게 3개 리스트로 분리
- {assignee_name}이 스터디 당일 해설할 수 있는 적절한 난이도와 명확한 힌트 제공

스터디 맥락: {context}
주제: {title}
막힌 부분: {reason}
"""
            schema = {
              "type": "OBJECT",
              "properties": {
                "description": {"type": "STRING"},
                "questions": {
                  "type": "ARRAY",
                  "items": {"type": "STRING"}
                },
                "hint": {"type": "STRING"}
              },
              "required": ["description", "questions", "hint"]
            }
            
            result = call_gemini(prompt, schema)
            if result:
              try:
                return json.loads(result)
              except:
                pass
            return {
              "description": f"{title} 관련 기초 실습 문제예요.",
              "questions": ["Q1. 개념을 직접 코드로 작성해보세요", "Q2. 결과를 예측해보세요", "Q3. 왜 그런 결과가 나왔는지 설명해보세요"],
              "hint": "기본 개념부터 차근차근 생각해보세요"
            }

          def send_message(webhook_url, payload):
            data = json.dumps(payload).encode('utf-8')
            req = urllib.request.Request(
              webhook_url, data=data,
              headers={'Content-Type': 'application/json'}, method='POST'
            )
            try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                print(f"  전송 완료 (HTTP {resp.status})")
                return True
            except Exception as e:
              print(f"  ERROR: {e}")
              return False

          failed = []
          quiz_sections = []

          for assignment in assignments:
            title = assignment['title']
            assignee_github = assignment['assignee']
            reason = assignment.get('reason', '')

            member_info = id_map.get(assignee_github)
            if not member_info:
              print(f"WARNING: {assignee_github} 정보 없음")
              failed.append(title)
              continue

            teams_id = member_info['teamsId']
            name = member_info['name']

            print(f"Gemini 질문 생성 중: {title} → {name}")

            # 발표자용 Q1, Q2 생성
            questions = generate_ticket_questions(title, reason)

            # 전원용 실습 문제 생성
            quiz = generate_quiz(title, reason, name)

            # 문제지 섹션 저장
            quiz_sections.append({
              'title': title,
              'assignee_name': name,
              'quiz': quiz
            })

            # #study-board 개인 티켓 전송
            payload = {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": f"📌 [{week}주차] <at>{name}</at>님 발표 티켓 ({presenting_team}팀)",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": f"🎯 주제: {title}",
                      "weight": "Bolder"
                    },
                    {
                      "type": "TextBlock",
                      "text": "발표 준비 가이드 질문이에요. 이 질문들을 중심으로 준비해주세요!",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"Q1. {questions['q1']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"Q2. {questions['q2']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": "💬 준비하다 막히면 여기에 댓글로 달아주세요! 팀원들이 같이 고민해드려요 🙌",
                      "isSubtle": True
                    },
                    {
                      "type": "TextBlock",
                      "text": "📁 발표 자료를 markdown으로 GitHub 본인 폴더에 올려주세요 🙏",
                      "color": "Attention"
                    }
                  ],
                  "msteams": {
                    "entities": [{
                      "type": "mention",
                      "text": f"<at>{name}</at>",
                      "mentioned": {"id": teams_id, "name": name}
                    }]
                  }
                }
              }]
            }

            success = send_message(webhook_board, payload)
            if not success:
              failed.append(title)

            time.sleep(2)

          # 문제지 markdown 파일 생성
          quiz_md = f"# {week}주차 실습 문제지 🧩\n\n"
          quiz_md += f"> 스터디 전날까지 GitHub 본인 폴더에\n"
          quiz_md += f"> `week{week}_quiz.md` 로 올려주세요!\n\n"
          quiz_md += "---\n\n"

          for i, section in enumerate(quiz_sections, 1):
            quiz_md += f"## 📌 문제 {i}. {section['title']}\n"
            quiz_md += f"해설 담당: {section['assignee_name']}\n\n"
            quiz_md += f"{section['quiz']['description']}\n\n"
            for q in section['quiz']['questions']:
              quiz_md += f"**{q}**\n\n"
            quiz_md += f"💡 힌트: {section['quiz']['hint']}\n\n"
            quiz_md += "---\n\n"

          # quiz 폴더에 저장
          os.makedirs('quiz', exist_ok=True)
          quiz_path = f"quiz/week{week}_quiz.md"
          with open(quiz_path, 'w', encoding='utf-8') as f:
            f.write(quiz_md)
          print(f"문제지 생성 완료: {quiz_path}")

          # #study-weekly에 문제지 알림 전송
          quiz_payload = {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.2",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": f"🧩 {week}주차 실습 문제지가 올라왔어요!",
                    "weight": "Bolder",
                    "size": "Medium"
                  },
                  {
                    "type": "TextBlock",
                    "text": "스터디 전날까지 풀어서 GitHub 본인 폴더에 올려주세요!",
                    "wrap": True
                  },
                  {
                    "type": "TextBlock",
                    "text": f"📁 quiz/week{week}_quiz.md 확인하세요!",
                    "color": "Attention"
                  }
                ]
              }
            }]
          }
          send_message(webhook_weekly, quiz_payload)

          # 실패 항목 알림
          if failed:
            error_payload = {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {"type": "TextBlock", "text": "⚠️ 일부 티켓 전송 실패", "weight": "Bolder", "color": "Attention"},
                    {"type": "TextBlock", "text": f"실패: {', '.join(failed)}\nActions 로그를 확인해주세요.", "wrap": True}
                  ]
                }
              }]
            }
            send_message(webhook_weekly, error_payload)
          else:
            print("모든 티켓 전송 완료!")

          # 종료 코드 저장 (push용)
          with open('/tmp/quiz_path.txt', 'w') as f:
            f.write(quiz_path)
          PYEOF

      - name: 문제지 repo에 자동 push
        run: |
          QUIZ_PATH=$(cat /tmp/quiz_path.txt)
          git config user.name "study-bot"
          git config user.email "study-bot@github.com"
          git add "$QUIZ_PATH"
          git diff --cached --quiet || git commit -m "auto: $QUIZ_PATH 문제지 생성"
          git push