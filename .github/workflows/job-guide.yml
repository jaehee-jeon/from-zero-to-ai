iname: job-guide

on:
  workflow_call:
    inputs:
      assignments:
        required: true
        type: string
      round:
        required: true
        type: string
      context:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      TEAMS_WEBHOOK_BOARD:
        required: true
      TEAMS_WEBHOOK_WEEKLY:
        required: true

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 문제지 덮어쓰기 방지 확인
        env:
          ROUND: ${{ inputs.round }}
        run: |
          QUIZ_PATH="quiz/round${ROUND}_quiz.md"
          if [ -f "$QUIZ_PATH" ]; then
            echo "ERROR: $QUIZ_PATH 이미 존재합니다. round 번호를 확인해주세요."
            exit 1
          fi
          echo "문제지 경로 확인 완료: $QUIZ_PATH"

      - name: 질문 생성 + 티켓 전송 + 문제지 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEAMS_WEBHOOK_BOARD: ${{ secrets.TEAMS_WEBHOOK_BOARD }}
          TEAMS_WEBHOOK_WEEKLY: ${{ secrets.TEAMS_WEBHOOK_WEEKLY }}
          ASSIGNMENTS: ${{ inputs.assignments }}
          ROUND: ${{ inputs.round }}
          CONTEXT: ${{ inputs.context }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error, time, re

          assignments = json.loads(os.environ['ASSIGNMENTS'])
          round_num = os.environ['ROUND']
          context = os.environ['CONTEXT']
          api_key = os.environ['ANTHROPIC_API_KEY']
          webhook_board = os.environ['TEAMS_WEBHOOK_BOARD']
          webhook_weekly = os.environ['TEAMS_WEBHOOK_WEEKLY']

          with open('config/members.json', 'r', encoding='utf-8') as f:
            members = json.load(f)

          id_map = {m['githubUsername']: {'teamsId': m['teamsId'], 'name': m['name']} for m in members}

          MODEL = "claude-sonnet-4-5-20250929"
          URL = "https://api.anthropic.com/v1/messages"

          # ── Claude 호출 (429/503/529 재시도 포함) ────────────────
          def call_claude(prompt, max_retries=3):
            payload = {
              "model": MODEL,
              "max_tokens": 1024,
              "messages": [{"role": "user", "content": prompt}]
            }
            data = json.dumps(payload).encode('utf-8')

            for attempt in range(max_retries):
              req = urllib.request.Request(
                URL, data=data,
                headers={
                  "Content-Type": "application/json",
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01"
                },
                method='POST'
              )
              try:
                with urllib.request.urlopen(req, timeout=60) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  return result['content'][0]['text'].strip()
              except urllib.error.HTTPError as e:
                if e.code in (429, 503, 529):
                  wait = (attempt + 1) * 5  # 5초, 10초, 15초
                  print(f"WARNING: {e.code} 재시도 중... ({attempt+1}/{max_retries}, {wait}초 대기)")
                  time.sleep(wait)
                else:
                  print(f"WARNING: Claude API 실패 (HTTP Error {e.code})")
                  return None
              except Exception as e:
                print(f"WARNING: Claude API 실패 ({e})")
                return None

            print("WARNING: 최대 재시도 횟수 초과 → fallback 사용")
            return None

          # ── JSON 파싱 헬퍼 (코드펜스 제거) ───────────────────────
          def parse_json(text):
            if not text:
              return None
            text = re.sub(r'```(?:json)?', '', text).strip()
            try:
              return json.loads(text)
            except:
              m = re.search(r'\{.*\}', text, re.DOTALL)
              if m:
                try:
                  return json.loads(m.group(0))
                except:
                  pass
            return None

          # ── 분야별 가이드 B 항목 지시 ────────────────────────────
          GUIDE_B = {
            "coding": "초보자가 자주 틀리는 코드 부분을 짚고, 짧은 코드 예시를 포함해 '왜 그렇게 생각하는지 설명해주세요' 형식으로",
            "architecture": "구성/서비스를 잘못 선택하기 쉬운 상황을 짚고, 구체적인 상황 예시와 함께 '왜 그렇게 생각하는지 설명해주세요' 형식으로",
            "ml": "모델/학습/평가에서 초보자가 자주 오해하는 부분을 짚고, 구체적인 상황 예시와 함께 '왜 그렇게 생각하는지 설명해주세요' 형식으로",
            "solution": "AI 솔루션 설계에서 흔히 놓치는 부분을 짚고, 구체적인 상황 예시와 함께 '왜 그렇게 생각하는지 설명해주세요' 형식으로",
          }

          # ── 발표자 티켓 가이드 생성 ──────────────────────────────
          def generate_ticket_questions(title, reason, category):
            guide_b = GUIDE_B.get(category, GUIDE_B["coding"])
            prompt = f"""
            당신은 학습 설계 전문가입니다.
            비전공자와 전공자가 반반인 스터디에서
            발표자가 이 개념을 완벽히 이해하고
            잘 전달할 수 있도록 가이드 3가지를 한국어로 만들어주세요.

            A. 개념 차이를 설명하게 하는 질문
               - 이 개념을 처음 배울 때 가장 헷갈리는 기초적인 두 가지를 비교
               - 새로운 문법이나 심화 기능은 끌어오지 말 것
               - 기본 자료 한 번 읽었으면 답할 수 있는 수준
               - 답하면서 개념이 명확해지는 질문

            B. 실수하기 쉬운 부분을 짚는 질문
               - {guide_b}
               - 초보자가 자주 틀리는 부분을 정확히 집어서

            C. 응용 질문
               - A, B를 이해한 사람이 한 발 더 나아가게 하는 질문
               - 개념의 특성이나 설계 이유를 생각하게 하는 질문
               - 공부 더 한 사람이라면 답할 수 있는 수준

            조건:
            - 반드시 한국어
            - 각 2-3줄 이내로 간결하게
            - 답을 주는 질문 절대 금지
            - 전공 용어 최소화

            반드시 JSON으로만 반환. 다른 텍스트나 코드펜스 없이 JSON 객체만 출력하세요.
            {{"a": "질문", "b": "질문", "c": "질문"}}

            주제: {title}
            막힌 부분: {reason}
            맥락: {context}
            """
            result = parse_json(call_claude(prompt))
            if result and all(k in result for k in ('a', 'b', 'c')):
              return result
            return {
              "a": f"{title}에서 처음 배울 때 헷갈리기 쉬운 두 가지를 비교해서 설명해주세요.",
              "b": f"{title}을 처음 배울 때 자주 실수하는 부분은 무엇인가요?",
              "c": f"{title}이 실무에서 왜 필요한지 설명해주세요."
            }

          # ── 분야별 퀴즈 출제 지시 ────────────────────────────────
          QUIZ_GUIDE = {
            "coding": """
            - 실제로 코드나 쿼리를 1-2줄 작성해서 푸는 문제
            - 단순한 구조만 사용, 정답이 명확한 문제
            - description: 가상의 데이터나 코드 상황 (3줄 이내)""",
            "architecture": """
            - 구체적인 요구사항/상황을 주고, 어떤 구성이나 서비스를
              선택해야 하는지 한 가지를 고르고 이유를 쓰게 하는 문제
            - 정답 방향이 명확한 문제 (지나치게 열린 문제 금지)
            - description: 가상의 시스템 요구사항 상황 (3줄 이내)""",
            "ml": """
            - 모델/학습/평가 관련 개념을 실제 상황에 적용해
              판단하거나 한 줄로 설명하게 하는 문제
            - 코드 없이도 풀 수 있는 개념 적용 문제
            - description: 가상의 데이터셋이나 학습 상황 (3줄 이내)""",
            "solution": """
            - AI 솔루션을 만들 때의 접근 방식이나 흐름을 묻는 문제
            - "이 상황에서 어떤 순서/방법으로 접근할까" 형식
            - 정답 방향이 명확한 문제
            - description: 가상의 비즈니스 요구사항 상황 (3줄 이내)""",
          }

          # ── 분야별 fallback ──────────────────────────────────────
          def quiz_fallback(category, title):
            base = {
              "coding": {
                "description": f"data = ['항목1', '항목2', '항목3']\n\n{title} 관련 기초 실습이에요.",
                "question": "첫 번째 항목과 마지막 항목을 출력하는 코드를 작성하세요.",
              },
              "architecture": {
                "description": f"소규모 웹 서비스를 Azure에 올리려는 상황이에요.\n{title} 관련 구성을 고민 중이에요.",
                "question": "이 상황에서 어떤 구성을 선택할지 한 가지 고르고 이유를 한 줄로 써보세요.",
                "hint": "요구사항(규모·비용·확장성)을 기준으로 생각해보세요.",
              },
              "ml": {
                "description": f"학습 데이터로 모델을 만들었는데 결과가 기대와 달라요.\n{title}과 관련된 상황이에요.",
                "question": "이 상황에서 무엇을 먼저 확인해야 할지 한 줄로 설명하세요.",
                "hint": "데이터와 모델 중 어디부터 볼지 생각해보세요.",
              },
              "solution": {
                "description": f"회사에서 AI 기능을 도입하려는 상황이에요.\n{title}과 관련이 있어요.",
                "question": "이 기능을 만들 때 어떤 순서로 접근할지 한 줄로 써보세요.",
                "hint": "요구 정의 → 데이터 → 구현 흐름을 떠올려보세요.",
              },
            }
            b = base.get(category, base["coding"])
            b["real_world"] = f"실제로 이런 상황에서 써요: {title}은 실무에서 자주 활용돼요."
            return b

          #  전원용 실습 문제 생성 
          def generate_quiz(title, reason, category):
            guide = QUIZ_GUIDE.get(category, QUIZ_GUIDE["coding"])
            prompt = f"""
            당신은 실습 문제 출제자입니다.
            비전공자도 기본 자료를 보면 풀 수 있는
            문제 1개와 실무 활용 설명을 만들어주세요.

            문제 조건 (주제 유형: {category}):
            {guide}
            - 문제는 반드시 1개
            - 기본 자료 보면 풀 수 있는 수준
            - question: 직접 써야 답할 수 있는 문제 1개

            실무 활용 설명 조건:
            - 이 개념이 실무에서 어떻게 쓰이는지 2-3줄로 설명
            - 쉽고 친근하게, "실제로 이런 상황에서 써요" 형식

            반드시 JSON으로만 반환. 다른 텍스트나 코드펜스 없이 JSON 객체만 출력하세요.
            {{"description": "상황 설명", "question": "문제", "real_world": "실무 활용 설명"}}

            주제: {title}
            막힌 부분: {reason}
            맥락: {context}
            """
            result = parse_json(call_claude(prompt))
            if result and all(k in result for k in ('description', 'question', 'real_world')):
              return result
            return quiz_fallback(category, title)

          # Teams 메시지 전송 
          def send_message(webhook_url, payload):
            data = json.dumps(payload).encode('utf-8')
            req = urllib.request.Request(
              webhook_url, data=data,
              headers={'Content-Type': 'application/json'}, method='POST'
            )
            try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                print(f"  전송 완료 (HTTP {resp.status})")
                return True
            except Exception as e:
              print(f"  ERROR: {e}")
              return False

          # 메인 루프 
          failed = []
          quiz_sections = []

          for assignment in assignments:
            title = assignment['title']
            week_label = assignment.get('weekLabel', '')
            assignee_github = assignment['assignee']
            reason = assignment.get('reason', '')
            category = assignment.get('category', 'coding')

            member_info = id_map.get(assignee_github)
            if not member_info:
              print(f"WARNING: {assignee_github} 정보 없음")
              failed.append(title)
              continue

            teams_id = member_info['teamsId']
            name = member_info['name']

            print(f"질문 생성 중: [{week_label}] {title} ({category}) → {name}")

            guide = generate_ticket_questions(title, reason, category)
            quiz = generate_quiz(title, reason, category)

            quiz_sections.append({
              'title': title,
              'weekLabel': week_label,
              'assignee_name': name,
              'category': category,
              'quiz': quiz
            })

            # #study-board 개인 티켓 전송
            payload = {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": f"📌 [Round {round_num} / {week_label}] <at>{name}</at>님 발표 티켓",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": f"🎯 주제: {title}",
                      "weight": "Bolder"
                    },
                    {
                      "type": "TextBlock",
                      "text": "발표 준비 가이드예요. 아래 질문들을 중심으로 준비해주세요!",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"[개념 차이]\n{guide['a']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"[실수 포인트]\n{guide['b']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"[응용]\n{guide['c']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": "💬 준비하다 막히면 여기에 댓글로 달아주세요! 팀원들이 같이 고민해드려요 🙌",
                      "isSubtle": True
                    },
                    {
                      "type": "TextBlock",
                      "text": "📁 발표 자료를 markdown으로 GitHub 본인 폴더에 올려주세요 🙏",
                      "color": "Attention"
                    }
                  ],
                  "msteams": {
                    "entities": [{
                      "type": "mention",
                      "text": f"<at>{name}</at>",
                      "mentioned": {"id": teams_id, "name": name}
                    }]
                  }
                }
              }]
            }

            success = send_message(webhook_board, payload)
            if not success:
              failed.append(title)

            time.sleep(2)

          # 문제지 markdown 생성 
          quiz_md = f"# Round {round_num} 실습 문제지 🧩\n\n"
          quiz_md += "> 스터디 전날까지 GitHub 본인 폴더에\n"
          quiz_md += f"> `round{round_num}_quiz.md` 로 올려주세요!\n\n"
          quiz_md += "---\n\n"

          for i, section in enumerate(quiz_sections, 1):
            quiz_md += f"## 📌 문제 {i}. [{section['weekLabel']}] {section['title']}\n"
            quiz_md += f"해설 담당: {section['assignee_name']}\n\n"
            if section['category'] == 'coding':
              quiz_md += f"```python\n{section['quiz']['description']}\n```\n\n"
            else:
              quiz_md += f"{section['quiz']['description']}\n\n"
            quiz_md += f"**{section['quiz']['question']}**\n\n"
            quiz_md += f"💡 힌트: {section['quiz']}\n\n"
            quiz_md += f"🌍 실무에서는 이렇게 써요:\n{section['quiz']['real_world']}\n\n"
            quiz_md += "---\n\n"

          os.makedirs('quiz', exist_ok=True)
          quiz_path = f"quiz/round{round_num}_quiz.md"
          with open(quiz_path, 'w', encoding='utf-8') as f:
            f.write(quiz_md)
          print(f"문제지 생성 완료: {quiz_path}")

          # 문제지 알림 전송 
          quiz_payload = {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.2",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": f"🧩 Round {round_num} 실습 문제지가 올라왔어요!",
                    "weight": "Bolder",
                    "size": "Medium"
                  },
                  {
                    "type": "TextBlock",
                    "text": "스터디 전날까지 풀어서 GitHub 본인 폴더에 올려주세요!",
                    "wrap": True
                  },
                  {
                    "type": "TextBlock",
                    "text": f"📁 quiz/round{round_num}_quiz.md 확인하세요!",
                    "color": "Attention"
                  }
                ]
              }
            }]
          }
          send_message(webhook_weekly, quiz_payload)

          if failed:
            error_payload = {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {"type": "TextBlock", "text": "⚠️ 일부 티켓 전송 실패", "weight": "Bolder", "color": "Attention"},
                    {"type": "TextBlock", "text": f"실패: {', '.join(failed)}\nActions 로그를 확인해주세요.", "wrap": True}
                  ]
                }
              }]
            }
            send_message(webhook_weekly, error_payload)
          else:
            print("모든 티켓 전송 완료!")

          with open('/tmp/quiz_path.txt', 'w') as f:
            f.write(quiz_path)
          PYEOF

      - name: 문제지 repo에 자동 push
        run: |
          QUIZ_PATH=$(cat /tmp/quiz_path.txt)
          git config user.name "study-bot"
          git config user.email "study-bot@github.com"
          git add "$QUIZ_PATH"
          git diff --cached --quiet || git commit -m "auto: $QUIZ_PATH 문제지 생성"
          git push
