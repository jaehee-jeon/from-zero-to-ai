name: job-guide

on:
  workflow_call:
    inputs:
      assignments:
        required: true
        type: string
      round:
        required: true
        type: string
      context:
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true
      TEAMS_WEBHOOK_BOARD:
        required: true
      TEAMS_WEBHOOK_WEEKLY:
        required: true

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 문제지 덮어쓰기 방지 확인
        env:
          ROUND: ${{ inputs.round }}
        run: |
          QUIZ_PATH="quiz/round${ROUND}_quiz.md"
          if [ -f "$QUIZ_PATH" ]; then
            echo "ERROR: $QUIZ_PATH 이미 존재합니다. round 번호를 확인해주세요."
            exit 1
          fi
          echo "문제지 경로 확인 완료: $QUIZ_PATH"

      - name: 질문 생성 + 티켓 전송 + 문제지 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_WEBHOOK_BOARD: ${{ secrets.TEAMS_WEBHOOK_BOARD }}
          TEAMS_WEBHOOK_WEEKLY: ${{ secrets.TEAMS_WEBHOOK_WEEKLY }}
          ASSIGNMENTS: ${{ inputs.assignments }}
          ROUND: ${{ inputs.round }}
          CONTEXT: ${{ inputs.context }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error, time

          assignments = json.loads(os.environ['ASSIGNMENTS'])
          round_num = os.environ['ROUND']
          context = os.environ['CONTEXT']
          api_key = os.environ['GEMINI_API_KEY']
          webhook_board = os.environ['TEAMS_WEBHOOK_BOARD']
          webhook_weekly = os.environ['TEAMS_WEBHOOK_WEEKLY']

          with open('config/members.json', 'r', encoding='utf-8') as f:
            members = json.load(f)

          id_map = {m['githubUsername']: {'teamsId': m['teamsId'], 'name': m['name']} for m in members}

          MODEL = "gemini-2.5-flash"
          URL = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent?key={api_key}"

          # ── Gemini 호출 ──────────────────────────────────────────
          def call_gemini(prompt, schema):
            payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                "responseMimeType": "application/json",
                "responseSchema": schema
              }
            }
            data = json.dumps(payload).encode('utf-8')
            req = urllib.request.Request(
              URL, data=data,
              headers={"Content-Type": "application/json"},
              method='POST'
            )
            try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                result = json.loads(resp.read().decode('utf-8'))
                return result['candidates'][0]['content']['parts'][0]['text'].strip()
            except Exception as e:
              print(f"WARNING: Gemini API 실패 ({e})")
              return None

          # ── 발표자 티켓 가이드 생성 ──────────────────────────────
          def generate_ticket_questions(title, reason):
            prompt = f"""
당신은 학습 설계 전문가입니다.
비전공자와 전공자가 반반인 스터디에서
발표자가 이 개념을 완벽히 이해하고
잘 전달할 수 있도록 가이드 3가지를 한국어로 만들어주세요.

A. 개념 차이를 설명하게 하는 질문
   - 이 개념 안에서 헷갈리기 쉬운 두 가지를 비교하게 하는 질문
   - 공부했으면 답할 수 있는 수준
   - 답하면서 개념이 명확해지는 질문

B. 실수하기 쉬운 부분을 짚는 질문
   - 초보자가 자주 틀리는 부분을 정확히 집어서
   - "왜 그렇게 생각하는지 설명해주세요" 형식
   - 구체적인 코드 예시 포함

C. 응용 질문
   - A, B를 이해한 사람이 한 발 더 나아가게 하는 질문
   - 개념의 특성이나 설계 이유를 생각하게 하는 질문
   - 공부 더 한 사람이라면 답할 수 있는 수준

조건:
- 반드시 한국어
- 각 2-3줄 이내로 간결하게
- 답을 주는 질문 절대 금지
- 전공 용어 최소화

반드시 JSON으로만 반환.
{{"a": "질문", "b": "질문", "c": "질문"}}

주제: {title}
막힌 부분: {reason}
맥락: {context}
"""
            schema = {
              "type": "OBJECT",
              "properties": {
                "a": {"type": "STRING"},
                "b": {"type": "STRING"},
                "c": {"type": "STRING"}
              },
              "required": ["a", "b", "c"]
            }
            result = call_gemini(prompt, schema)
            if result:
              try:
                return json.loads(result)
              except:
                pass
            return {
              "a": f"{title}의 핵심 개념 두 가지를 비교해서 설명해주세요.",
              "b": f"{title}을 처음 배울 때 자주 실수하는 부분은 무엇인가요?",
              "c": f"{title}이 실제 데이터 처리에서 왜 필요한지 설명해주세요."
            }

          # ── 전원용 실습 문제 생성 ────────────────────────────────
          def generate_quiz(title, reason):
            prompt = f"""
당신은 실습 문제 출제자입니다.
비전공자도 기본 서적을 보면 풀 수 있는
실습 문제 1개와 실무 활용 설명을 만들어주세요.

문제 조건:
- 문제는 반드시 1개
- 기본 서적 보면 풀 수 있는 수준
- 단순 리스트만 사용 (딕셔너리 중첩 금지)
- 코드 1-2줄로 풀 수 있는 수준
- 정답이 명확한 문제
- description: 데이터 느낌의 가상 리스트 (3줄 이내)
- question: 쉽지만 직접 써야 답 가능한 문제 1개
- hint: 핵심 키워드 1줄

실무 활용 설명 조건:
- 이 개념이 실무에서 어떻게 쓰이는지 2-3줄로 설명
- 쉽고 친근하게
- "실제로 이런 상황에서 써요" 형식

반드시 JSON으로만 반환.
{{"description": "상황 설명 + 파이썬 코드", "question": "문제", "hint": "힌트", "real_world": "실무 활용 설명"}}

주제: {title}
막힌 부분: {reason}
맥락: {context}
"""
            schema = {
              "type": "OBJECT",
              "properties": {
                "description": {"type": "STRING"},
                "question": {"type": "STRING"},
                "hint": {"type": "STRING"},
                "real_world": {"type": "STRING"}
              },
              "required": ["description", "question", "hint", "real_world"]
            }
            result = call_gemini(prompt, schema)
            if result:
              try:
                return json.loads(result)
              except:
                pass
            return {
              "description": f"data = ['데이터1', '데이터2', '데이터3']\n\n{title} 관련 기초 실습 문제예요.",
              "question": "첫 번째 항목과 마지막 항목을 출력하는 코드를 작성하세요.",
              "hint": "인덱스 번호와 음수 인덱스를 활용해보세요.",
              "real_world": f"실제로 이런 상황에서 써요: {title}은 데이터를 다룰 때 필수적으로 사용돼요."
            }

          # ── Teams 메시지 전송 ────────────────────────────────────
          def send_message(webhook_url, payload):
            data = json.dumps(payload).encode('utf-8')
            req = urllib.request.Request(
              webhook_url, data=data,
              headers={'Content-Type': 'application/json'}, method='POST'
            )
            try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                print(f"  전송 완료 (HTTP {resp.status})")
                return True
            except Exception as e:
              print(f"  ERROR: {e}")
              return False

          # ── 메인 루프 ────────────────────────────────────────────
          failed = []
          quiz_sections = []

          for assignment in assignments:
            title = assignment['title']
            week_label = assignment.get('weekLabel', '')
            assignee_github = assignment['assignee']
            reason = assignment.get('reason', '')

            member_info = id_map.get(assignee_github)
            if not member_info:
              print(f"WARNING: {assignee_github} 정보 없음")
              failed.append(title)
              continue

            teams_id = member_info['teamsId']
            name = member_info['name']

            print(f"질문 생성 중: [{week_label}] {title} → {name}")

            guide = generate_ticket_questions(title, reason)
            quiz = generate_quiz(title, reason)

            quiz_sections.append({
              'title': title,
              'weekLabel': week_label,
              'assignee_name': name,
              'quiz': quiz
            })

            # #study-board 개인 티켓 전송
            payload = {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": f"📌 [Round {round_num} / {week_label}] <at>{name}</at>님 발표 티켓",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": f"🎯 주제: {title}",
                      "weight": "Bolder"
                    },
                    {
                      "type": "TextBlock",
                      "text": "발표 준비 가이드예요. 아래 질문들을 중심으로 준비해주세요!",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"[개념 차이]\n{guide['a']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"[실수 포인트]\n{guide['b']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": f"[응용]\n{guide['c']}",
                      "wrap": True
                    },
                    {
                      "type": "TextBlock",
                      "text": "💬 준비하다 막히면 여기에 댓글로 달아주세요! 팀원들이 같이 고민해드려요 🙌",
                      "isSubtle": True
                    },
                    {
                      "type": "TextBlock",
                      "text": "📁 발표 자료를 markdown으로 GitHub 본인 폴더에 올려주세요 🙏",
                      "color": "Attention"
                    }
                  ],
                  "msteams": {
                    "entities": [{
                      "type": "mention",
                      "text": f"<at>{name}</at>",
                      "mentioned": {"id": teams_id, "name": name}
                    }]
                  }
                }
              }]
            }

            success = send_message(webhook_board, payload)
            if not success:
              failed.append(title)

            time.sleep(2)

          # ── 문제지 markdown 생성 ─────────────────────────────────
          quiz_md = f"# Round {round_num} 실습 문제지 🧩\n\n"
          quiz_md += "> 스터디 전날까지 GitHub 본인 폴더에\n"
          quiz_md += f"> `round{round_num}_quiz.md` 로 올려주세요!\n\n"
          quiz_md += "---\n\n"

          for i, section in enumerate(quiz_sections, 1):
            quiz_md += f"## 📌 문제 {i}. [{section['weekLabel']}] {section['title']}\n"
            quiz_md += f"해설 담당: {section['assignee_name']}\n\n"
            quiz_md += f"```python\n{section['quiz']['description']}\n```\n\n"
            quiz_md += f"**{section['quiz']['question']}**\n\n"
            quiz_md += f"💡 힌트: {section['quiz']['hint']}\n\n"
            quiz_md += f"🌍 실무에서는 이렇게 써요:\n{section['quiz']['real_world']}\n\n"
            quiz_md += "---\n\n"

          os.makedirs('quiz', exist_ok=True)
          quiz_path = f"quiz/round{round_num}_quiz.md"
          with open(quiz_path, 'w', encoding='utf-8') as f:
            f.write(quiz_md)
          print(f"문제지 생성 완료: {quiz_path}")

          # ── 문제지 알림 전송 ─────────────────────────────────────
          quiz_payload = {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.2",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": f"🧩 Round {round_num} 실습 문제지가 올라왔어요!",
                    "weight": "Bolder",
                    "size": "Medium"
                  },
                  {
                    "type": "TextBlock",
                    "text": "스터디 전날까지 풀어서 GitHub 본인 폴더에 올려주세요!",
                    "wrap": True
                  },
                  {
                    "type": "TextBlock",
                    "text": f"📁 quiz/round{round_num}_quiz.md 확인하세요!",
                    "color": "Attention"
                  }
                ]
              }
            }]
          }
          send_message(webhook_weekly, quiz_payload)

          if failed:
            error_payload = {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {"type": "TextBlock", "text": "⚠️ 일부 티켓 전송 실패", "weight": "Bolder", "color": "Attention"},
                    {"type": "TextBlock", "text": f"실패: {', '.join(failed)}\nActions 로그를 확인해주세요.", "wrap": True}
                  ]
                }
              }]
            }
            send_message(webhook_weekly, error_payload)
          else:
            print("모든 티켓 전송 완료!")

          with open('/tmp/quiz_path.txt', 'w') as f:
            f.write(quiz_path)
          PYEOF

      - name: 문제지 repo에 자동 push
        run: |
          QUIZ_PATH=$(cat /tmp/quiz_path.txt)
          git config user.name "study-bot"
          git config user.email "study-bot@github.com"
          git add "$QUIZ_PATH"
          git diff --cached --quiet || git commit -m "auto: $QUIZ_PATH 문제지 생성"
          git push
